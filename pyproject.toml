[project]
name = "intuition-sys-dis"
version = "0.1.0"
description = "ML System Design: RAG-ассистент для чтения книг (Intuition)"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
